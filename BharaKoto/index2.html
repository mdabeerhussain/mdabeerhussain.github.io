<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>বাস ভাড়া ক্যালকুলেটর</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@300;400;500;600;700;800;900&display=swap");

      body {
        font-family: "Noto Serif Bengali", serif;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.08), transparent 30%),
          radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.1), transparent 30%),
          #f8fbff;
      }

      select {
        appearance: none;
        background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 8l4 4 4-4' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 1rem center;
        background-size: 1.25rem;
      }
    </style>

    <script src="data.js"></script>
  </head>

  <body class="min-h-screen px-4 py-6 text-slate-950 sm:px-6">
    <main class="mx-auto w-full max-w-xl">
      <header class="mb-8">
        <div
          class="mb-4 inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-500 shadow-sm"
        >
          <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
          ঢাকা মেট্রো বাস ভাড়া
        </div>

        <h1 class="text-4xl font-black leading-tight tracking-tight text-slate-950">
          সহজে জানুন আপনার বাস ভাড়া
        </h1>

        <p class="mt-3 max-w-md text-base leading-7 text-slate-500">
          রুট, যাত্রা শুরুর স্থান এবং গন্তব্য নির্বাচন করলেই ভাড়া ও দূরত্ব দেখা যাবে।
        </p>
      </header>

      <section class="space-y-5">
        <div class="rounded-[1.7rem] border border-slate-200 bg-white p-5 shadow-sm">
          <label class="mb-3 block text-sm font-bold text-slate-400">
            বাসের রুট
          </label>

          <select
            id="route"
            class="w-full rounded-[1.35rem] border border-slate-100 bg-slate-50 px-5 py-5 pr-12 text-lg font-black text-slate-900 outline-none transition-all focus:border-blue-200 focus:bg-white focus:ring-4 focus:ring-blue-500/10"
          ></select>
        </div>

        <div class="rounded-[1.7rem] border border-slate-200 bg-white p-5 shadow-sm">
          <label class="mb-3 block text-sm font-bold text-slate-400">
            কোথা থেকে
          </label>

          <select
            id="start"
            class="w-full rounded-[1.35rem] border border-slate-100 bg-slate-50 px-5 py-5 pr-12 text-lg font-black text-slate-900 outline-none transition-all focus:border-blue-200 focus:bg-white focus:ring-4 focus:ring-blue-500/10"
          ></select>
        </div>

        <div class="rounded-[1.7rem] border border-slate-200 bg-white p-5 shadow-sm">
          <label class="mb-3 block text-sm font-bold text-slate-400">
            কোথায় যাবেন
          </label>

          <select
            id="end"
            class="w-full rounded-[1.35rem] border border-slate-100 bg-slate-50 px-5 py-5 pr-12 text-lg font-black text-slate-900 outline-none transition-all focus:border-blue-200 focus:bg-white focus:ring-4 focus:ring-blue-500/10"
          ></select>
        </div>

        <div
          id="result-box"
          class="hidden overflow-hidden rounded-[2rem] bg-slate-950 text-white shadow-[0_28px_70px_rgba(15,23,42,0.22)]"
        >
          <div
            class="relative p-7"
            style="background: radial-gradient(circle at right top, rgba(20,184,166,.22), transparent 38%), #020617;"
          >
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="text-sm font-bold text-white/40">মোট ভাড়া</div>
                <div
                  id="fare-val"
                  class="mt-2 text-5xl font-black tracking-tight text-white"
                >
                  ৳ ১০.০০
                </div>
              </div>

              <div
                id="route-meta"
                class="rounded-full bg-emerald-400/15 px-4 py-2 text-sm font-black text-emerald-300"
              >
                --
              </div>
            </div>

            <div class="mt-8 grid grid-cols-2 gap-4">
              <div class="rounded-[1.35rem] bg-white/10 p-5">
                <div class="text-xs font-bold text-white/35">দূরত্ব</div>
                <div
                  id="distance-val"
                  class="mt-2 text-2xl font-black text-blue-300"
                >
                  ০.০ কি.মি.
                </div>
              </div>

              <a
                id="brta-link"
                href="#"
                target="_blank"
                class="flex items-center justify-center rounded-[1.35rem] bg-white px-5 py-5 text-center text-sm font-black text-slate-950 transition-all hover:bg-blue-50"
              >
                মূল চার্ট দেখুন
              </a>
            </div>
          </div>
        </div>
      </section>

      <footer class="mt-8 text-center text-xs leading-relaxed text-slate-400">
        Data collected from
        <a
          href="https://brta.gov.bd/pages/static-pages/6922de89933eb65569e1b600"
          target="_blank"
          class="font-bold text-blue-600 hover:text-blue-700"
          >BRTA</a
        >
        and made by Md Abeer Hussain
      </footer>
    </main>

    <script>
      let routesData = [];
      let currentRoute = null;

      const routeSelect = document.getElementById("route");
      const startSelect = document.getElementById("start");
      const endSelect = document.getElementById("end");
      const resultBox = document.getElementById("result-box");
      const distanceVal = document.getElementById("distance-val");
      const fareVal = document.getElementById("fare-val");
      const routeMeta = document.getElementById("route-meta");
      const brtaLink = document.getElementById("brta-link");

      function toBengaliNum(num) {
        const engToBen = {
          0: "০",
          1: "১",
          2: "২",
          3: "৩",
          4: "৪",
          5: "৫",
          6: "৬",
          7: "৭",
          8: "৮",
          9: "৯",
          ".": ".",
        };
        return num.toString().replace(/[0-9.]/g, (w) => engToBen[w]);
      }

      window.onload = () => {
        if (typeof busData !== "undefined" && busData.routes) {
          routesData = busData.routes;

          routeSelect.innerHTML =
            '<option value="" disabled selected>বাসের রুট নির্বাচন করুন</option>';

          routesData.forEach((route, index) => {
            const opt = document.createElement("option");
            opt.value = index;
            opt.textContent = `${route.id}: ${route.name}`;
            routeSelect.appendChild(opt);
          });

          startSelect.innerHTML =
            '<option value="" disabled selected>প্রথমে রুট নির্বাচন করুন</option>';
          endSelect.innerHTML =
            '<option value="" disabled selected>প্রথমে রুট নির্বাচন করুন</option>';
        } else {
          alert("ডেটা লোড করতে সমস্যা হয়েছে! data.js ফাইলটি চেক করুন।");
        }
      };

      function updateStops() {
        if (routeSelect.value === "") return;

        const routeIndex = parseInt(routeSelect.value);
        currentRoute = routesData[routeIndex];

        routeMeta.textContent = `${toBengaliNum(currentRoute.farePerKm)} টাকা/কি.মি.`;

        if (currentRoute.brtaLink) {
          brtaLink.href = currentRoute.brtaLink;
          brtaLink.style.display = "flex";
        } else {
          brtaLink.style.display = "none";
        }

        startSelect.innerHTML =
          '<option value="" disabled selected>যাত্রা শুরুর স্থান নির্বাচন করুন</option>';
        endSelect.innerHTML =
          '<option value="" disabled selected>গন্তব্য নির্বাচন করুন</option>';

        currentRoute.stops.forEach((stop, index) => {
          const opt1 = document.createElement("option");
          opt1.value = index;
          opt1.textContent = stop.name;
          startSelect.appendChild(opt1);

          const opt2 = document.createElement("option");
          opt2.value = index;
          opt2.textContent = stop.name;
          endSelect.appendChild(opt2);
        });

        resultBox.classList.add("hidden");
      }

      function calculate() {
        if (startSelect.value === "" || endSelect.value === "") {
          resultBox.classList.add("hidden");
          return;
        }

        const startIndex = parseInt(startSelect.value);
        const endIndex = parseInt(endSelect.value);

        if (startIndex === endIndex) {
          resultBox.classList.add("hidden");
          return;
        }

        resultBox.classList.remove("hidden");

        const d1 = currentRoute.stops[startIndex].dist;
        const d2 = currentRoute.stops[endIndex].dist;
        const distance = Math.abs(d2 - d1);

        let rawFare = distance * currentRoute.farePerKm;
        let finalFare = Math.max(currentRoute.minFare, Math.round(rawFare));

        distanceVal.textContent = toBengaliNum(distance.toFixed(1)) + " কি.মি.";
        fareVal.textContent = "৳ " + toBengaliNum(finalFare.toFixed(2));
      }

      routeSelect.addEventListener("change", updateStops);
      startSelect.addEventListener("change", calculate);
      endSelect.addEventListener("change", calculate);
    </script>
  </body>
</html>
