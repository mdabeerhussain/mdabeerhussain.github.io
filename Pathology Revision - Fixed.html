idiform mole?", "What is gestational trophoblastic disease? Name the major disorders of this type of disease; mention hydatidiform mole (complete/partial). (Interpreted for clarity in source.)", "What is choriocarcinoma? Mention its sites.", "Name sexually transmitted diseases. Mention the organisms responsible for them.", "What is salpingitis? Mention its causes and complications.", "What is a dermoid cyst? What are the morphological cysts of the ovary? (Interpreted for clarity in source.)", "Name the non-neoplastic diseases of the uterus and cervix. Which one is most common?", "What is the most common? (Incomplete question in source.)", "What is a Pap smear? Mention its indications and importance."], "Breast": ["What are the clinical presentations of breast diseases? Name the inflammatory diseases of the breast.", "What is the most common non-proliferative breast change? Mention its important morphological features.", "Name the common benign and malignant breast tumors. How will you proceed to diagnose a case of breast lump?", "Name in situ carcinomas of the breast. To which group of lymph nodes does breast carcinoma usually metastasize?", "Mention the investigations for diagnosis of carcinoma of the breast. What is the role of IHC (immunohistochemistry) in carcinoma of the breast? (Interpreted for clarity in source.)"], "GIT (Gastrointestinal Tract)": ["Define peptic ulcer. What are the sites of peptic ulceration? Give the risk factors of PUD (peptic ulcer disease).", "Mention the causes of malabsorption syndrome. Give differences between ulcerative colitis and Crohn's disease.", "Define leukoplakia. Name the carcinomas of the oral cavity.", "Name some salivary gland tumors. Which one is a mixed tumor and why?", "Name the polyps of the gut. What is a juvenile polyp? Name some congenital diseases of the GIT."], "Hepatobiliary System": ["Mention important liver functions. What are the excretory tests of the liver?", "Define cirrhosis. Mention its causes and complications.", "Mention the indications of liver function tests. How can you assess the synthetic function of the liver?", "Mention the normal value of bilirubin. Tell the important differences between conjugated and unconjugated bilirubin.", "What kinds of bilirubin are found in different types of jaundice? What are the urinary and stool findings in hemolytic and obstructive jaundice?", "Define jaundice. What do you know about latent and clinical jaundice? Classify jaundice etiologically.", "What is cholecystitis? What are its risk factors?", "Mention the types of gallstones. What are the risk factors for gallstone development?", "Mention the complications of acute calculous cholecystitis. What are the complications of gallstones?", "What is kernicterus? What type of bilirubin is responsible for this?", "What are the outcomes of hepatitis in adults? Give its laboratory diagnosis.", "What are the hepatotropic viruses? Give their routes of transmission."], "Male Genital System": ["Tell the important indications of semen analysis. What are oligospermia, azoospermia and necrozoospermia?", "What is teratoma? Classify teratoma. Biological behavior of testicular tumors.", "Laboratory investigations done for carcinoma of the prostate. Normal value of PSA.", "Classify testicular tumors. What are the congenital anomalies of the testis?", "What is prostatitis? Mention its causes.", "List the diseases of the prostate. Which one is more common?", "What is orchitis? Mention its causes.", "Classify testicular tumors. Describe the morphology of seminoma. Which germ cell tumor of the ovary has the same morphology as seminoma? (Dysgerminoma, as noted in source.)"], "Clinical cases · General pathology – Cellular adaptation": ["A 60 year old man presented with high blood pressure for a prolonged period. What will be the effect on myocardium? What are the causes of left ventricular failure?", "A 70 year aged male has a blood pressure of 150/90 mm of Hg. If this condition remains untreated for years,what type of cellular adaptation will occur in myocardium? What are the late complications of systemic hypertension?", "A 50 year old male is a habitual cigarette smoker. What cellular adaptation will occur in his respiratory tract? What is the risk of this complication?", "A 45 years aged male had dysphagia and regurgitation of sour-tasting gastric contents. What cellular adaptation will occur if left untreated? What is the risk of this complication?", "A 45 years aged male had dysphagia and regurgitation of sour-tasting gastric contents. What cellular adaptation will occur if left untreated? What is the risk of this complication?"], "Clinical cases · General pathology – Cell injury": ["A 50 years aged chronic alcoholic man was admitted with central acute abdominal pain radiating back. His serum amylase was 12000u/L (Normal<300u/L). What will be your provisional diagnosis? What type of necrosis will be observed in peritoneum?"], "Clinical cases · General pathology – Inflammation": ["A boy of 7 years suddenly developed red painful swelling in the thigh with the rise of local temperature. What is your provisional diagnosis? How will you proceed to the diagnosis?", "A boy of 10 years developed pain and swelling at right inguinal region for 7 days. What is the likely diagnosis? What chemical mediators are responsible for pain and swelling?", "A boy of 14 years developed fever and swelling in left cervical region for 10 days. What is the provisional diagnosis? How will you confirm it?", "A boy of 7 years suddenly developed red painful swelling on left forearm with the rise of local temperature. He has a history of insect bite What is the probable diagnosis? What chemical mediators are responsible for pain and swelling?"], "Clinical cases · General pathology – Hemodynamics": ["A 30 year old male suddenly developed respiratory distress and chest pain after deep sea diving. What is the most likely diagnosis? What is the cause of this complication?", "A female of 25 years having full term pregnancy suddenly developed dyspnea and chest pain. What is your probable diagnosis? What is the fate of this condition?", "A 30 years aged victim of RTA was brought to the emergency with hypotension, weak, rapid pulse and cool, clammy skin. What is your probable diagnosis? Mention the other types.", "A 40 years male presented with hypotension, weak rapid pulse and cool clammy skin. He gave a history of severe vomiting and diarrhea followed by attending a wedding dinner.. What is your probable diagnosis? Mention the stages."], "Clinical cases · General pathology – Environment, Immunopathology and Others": ["A 10 year old boy suddenly developed local swelling, pain and itching in leg followed by an insect bite. What is your probable diagnosis ?what are the other causes?"], "Clinical cases · Hematology – Red cell disorders: Anemia": ["Male 54 yrs having weakness, pallor and evidence of neuropathy. He has h/o partial gastrectomy 3 yrs back. What is your provisional diagnosis? Mention the lab findings? What test will you do for confirmation?", "A 50 years old male clinically diagnosed as having a bleeding peptic ulcer for the last 1 year. What morphological type of anemia do you expect on his blood film? what will be the iron profile in this case?", "A 30 years aged pregnant lady has developed anemia her current Hb% is 5.5 gm/dl. What morphological type of anemia do you expect in her blood film? List RBC indices of this pt.", "A 58 Year old male underwent partial gastrectomy 2 years back. Now he has developed increasing weakness, fatigue and numbness of legs and feet. Examination reveals pallor of conjunctiva, smooth tongue and peripheral neuropathy. What is your provisional diagnosis? What will be the findings in PBF & bone marrow?", "A male of 20 years presented with severe anemia. His PBF reveals pancytopenia. What is your provisional diagnosis? What further investigations would you like to advise for this patient?", "A boy of 11 years came ": ["A 4 years aged boy presented with skin rash in legs, arms and upper chest and occasional epistaxis. His PBF showed thrombocytopenia. what is your probable dx? how will you proceed to the dx?", "A boy of 7 years is suffering from haemarthrosis. One of his maternal uncle is also having same condition. What is your provisional dx? How will you confirm it?", "A boy of 10 yrs presented with purpuric rash over skin and gum bleeding. What is the probable cause? What investigations are needed for evaluation?", "A woman presented with purpura, unusual vaginal bleeding followed by recent abortion. Dx? Tests to dx?", "A 10yrs male developed hemarthrosis following a small fall. One of his maternal uncles died at the age of 10 yrs due to uncontrolled bleeding following tooth extraction. Dx? Tests?", "A 12 yrs old boy presented with gum bleeding. His BT is prolonged but CT is normal. dx? To confirm?"], "Clinical cases · Hematology – WBC disorders: Leukemia": ["A 35 yrs old male presented with fever, bone pain & gum bleeding. Blood picture shows severe anemia with pancytopenia. What is your provisional diagnosis? What laboratory test should be performed to reach the diagnosis?", "A child of 5 years presents with fever, cervical lymphadenopathy and gum bleeding. What is the possible diagnosis? Which tests are necessary for confirmation?", "A boy of 5 years presented with severe anemia, sore throat, fever and gum bleeding. His peripheral blood film showed leukocytosis with the presence of immature WBC and thrombocytopenia. What is the probable diagnosis? How will you confirm your diagnosis?", "A boy of 7 years old presented with fever, sore throat, epistaxis and cervical lymphadenopathy. His peripheral blood film shows leukocytosis with 80% blast cell and thrombocytopenia. What is your clinical diagnosis? How will you proceed to confirm?", "A male of 75 years presented with lymphadenopathy, weakness and fatigue His PBF shows mild lymphocytosis with 80% mature Lymphocytes. What iovascular System & Vessels": ["A 60-year-old man presented with high blood pressure for a prolonged period. (a) What will be the effect on the myocardium? (b) What are the causes of left ventricular failure?", "A 70-year-old male has a blood pressure of 150/90 mmHg. If this condition remains untreated for years, (a) what type of cellular adaptation will occur in the myocardium? (b) What are the late complications of systemic hypertension?", "A 15-year-old male has come with multiple joint pain, fever, and skin rash on the trunk and limbs. He had a history of pharyngitis about 3 weeks back. (a) What is your probable diagnosis? (b) What laboratory tests will favor the diagnosis?", "A 65-year-old male presented with high-grade fever, chills and weakness following tooth extraction. On examination of the CVS, a murmur was found. The patient had a history of artificial heart valve replacement. (a) What is your probable diagnosis? (b) What are the complications?"], "Clinical cases · Respiratory System": ["A 50-year-old male is a habitual cigarette smoker. (a) What cellular adaptation will occur in his respiratory tract? (b) What is the risk of this complication?", "A 40-year-old male presented with cough, wheeze and severe dyspnea. His peripheral blood film revealed a raised eosinophil count. (a) What is your probable diagnosis? (b) What is the late complication of this disease?", "A 75-year-old male smoker presented with chest pain, cough and breathlessness for 6 months. He also had enlarged cervical lymph nodes on the right side. His chest X-ray showed a mass lesion in the right lung. (a) What is your possible diagnosis? (b) How will you confirm this case?"], "Clinical cases · Renal System": ["A boy of 5 years came with a puffy face. On examination, daily protein loss in urine is >3.5 g. (a) What is your probable diagnosis? (b) Give the common cause and prognosis in this case.", "A boy of 11 years presented with periorbital edema and high-colored urine following a history of sore throat 3 weeks back. His urine R/M/E shows RBCs 8–10/HPF and proteinuria (<3 g/day). (a) What is your probable diagnosis? (b) Give other tests to confirm your diagnosis.", "A 20-year-old female had left hypochondrial pain and occasional hematuria. Plain X-ray of the KUB region shows a staghorn shadow in the pelvis of the left kidney. (a) What is your diagnosis? (b) What are the complications?"], "Clinical cases · Bones": ["A 14-year-old boy presented with a painful, progressively enlarging mass in the thigh near the knee joint. The X-ray revealed a large osteolytic lesion with a triangular shadow in the distal femur. (a) What is the probable diagnosis? (b) What are the common bone tumors?"], "Clinical cases · Skin": ["A 60-year-old male patient presented with an ulcerated growth on the right cheek (sun- exposed area). (a) What is your probable diagnosis? (b) What type of tumor is this according to behavior?"], "Clinical cases · Diabetes Mellitus": ["A 45-year-old male has a fasting blood sugar of 7.5 mmol/L and a blood sugar of 15.6 mmol/L 2 hours after 75 g of glucose. (a) What is your provisional diagnosis? (b) Give the acute complications of DM.", "A 65-year-old male with prolonged uncontrolled diabetes developed a black ulcerated lesion on his right great toe. What is your probable diagnosis?"], "Clinical cases · Thyroid": ["A 40-year-old female presented with diffuse enlargement of the thyroid. The patient had low T3 and T4 levels and raised TSH. (a) What is your probable diagnosis? (b) What type of neoplasm can occur in this condition?"], "Clinical cases · Female Genital System": ["A 57-year-old postmenopausal female presented with offensive vaginal discharge and occasional per vaginal bleeding. On per vaginal examination, a cervical mass was found. (a) What is your provisional diagnosis? (b) How can you diagnose this case at an early stage?", "A 25-year-old female presented with severe dysmenorrhea, pelvic pain and subfertility. Her ultrasound show  for(let name of topics)data[b][name].forEach((_,i)=>{let m=state.marks[JSON.stringify([b,name,i])];counts[[1,2,3].includes(m)?m:4]++});
